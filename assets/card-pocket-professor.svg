<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" fill="none" role="img" aria-label="Pocket Professor: Turns YouTube and PDFs into spoken quizzes, graded by an LLM and scheduled with FSRS. &lt;2.5 s budget for spoken feedback.">
<title>Pocket Professor: Turns YouTube and PDFs into spoken quizzes, graded by an LLM and scheduled with FSRS. &lt;2.5 s budget for spoken feedback.</title>
<style>
.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}

.gl{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.nd{animation:pop 3.2s ease-in-out infinite both}
@keyframes pop{0%,100%{fill:#0A0D14}15%{fill:#22D3EE}35%{fill:#0A0D14}}
.bar{transform-box:fill-box;transform-origin:center;animation:eq 1.3s ease-in-out infinite both}
@keyframes eq{50%{transform:scaleY(.35)}}
.draw{stroke-dasharray:1;animation:draw 5s ease-in-out infinite both}
@keyframes draw{0%{stroke-dashoffset:1}40%,100%{stroke-dashoffset:0}}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<clipPath id="clip"><rect width="800" height="440" rx="20"/></clipPath>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" stroke="#fff" stroke-opacity="0.035"/></pattern>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#clip)"><rect width="800" height="440" fill="#0A0D14"/>
<rect width="800" height="440" fill="url(#grid)"/>
<ellipse class="gl" cx="700" cy="40" rx="320" ry="200" fill="url(#glow)"/>
<rect x="0" y="0" width="800" height="4" fill="#22D3EE"/>
<text x="48" y="76" class="m" font-size="22" font-weight="600" fill="#22D3EE" text-anchor="start" letter-spacing="2">VOICE-FIRST LEARNING</text>
<text x="48" y="144" class="s" font-size="62" font-weight="700" fill="#E6EDF3" text-anchor="start" letter-spacing="-1.5">Pocket Professor</text>
<text x="48" y="196" class="s" font-size="30" font-weight="400" fill="#C9D1D9" text-anchor="start" >Learn out loud from any video or PDF.</text>
<text x="48" y="330" class="s" font-size="88" font-weight="700" fill="#22D3EE" text-anchor="start" letter-spacing="-2">&lt;2.5 s</text>
<text x="48" y="378" class="s" font-size="25" font-weight="400" fill="#8B949E" text-anchor="start" >budget for spoken feedback</text>
<line x1="470" y1="286" x2="752" y2="286" stroke="#1E2532" stroke-width="2"/>
<circle class="nd" style="animation-delay:0.0s" cx="476" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:0.5s" cx="500" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:1.0s" cx="528" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:1.5s" cx="564" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:2.0s" cx="612" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:2.5s" cx="672" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<circle class="nd" style="animation-delay:3.0s" cx="746" cy="286" r="9" fill="#0A0D14" stroke="#22D3EE" stroke-width="2.5"/>
<text x="752" y="328" class="m" font-size="19" font-weight="400" fill="#8B949E" text-anchor="end" >review intervals grow</text>
<text x="752" y="410" class="m" font-size="22" font-weight="600" fill="#22D3EE" text-anchor="end" >open repo →</text>
</g>
<rect x="0.5" y="0.5" width="799" height="439" rx="20" stroke="#1E2532"/>
</svg>
