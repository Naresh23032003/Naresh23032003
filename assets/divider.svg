<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" fill="none" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="0.5"  stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="0.82" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1"    stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9D5FF" stop-opacity="0.95"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="strip"><rect x="0" y="4" width="1200" height="4" rx="2"/></clipPath>
  </defs>

  <style>
    .glide { animation: glide 5.5s cubic-bezier(.45,.05,.55,.95) infinite; }
    @keyframes glide {
      0%   { transform: translateX(-420px); }
      100% { transform: translateX(1260px); }
    }
    .breathe { animation: breathe 5.5s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }
  </style>

  <rect class="breathe" x="0" y="5" width="1200" height="2" rx="1" fill="url(#base)"/>

  <g clip-path="url(#strip)">
    <rect class="glide" x="0" y="4" width="360" height="4" fill="url(#shine)"/>
  </g>

  <circle class="breathe" cx="600" cy="6" r="2.6" fill="#A855F7"/>
</svg>
