<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" fill="none" role="img" aria-label="Nikki: Chat, long-term memory, voice calls and WhatsApp, fully offline. Guards live in code, not in prompts. 6 GB GPU budget for the whole voice stack.">
